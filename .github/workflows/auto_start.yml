name: Auto Start Server

on:
  schedule:
    # اجرا هر ۱۵ دقیقه یک‌بار برای بیدار کردن سرور خاموش‌شده
    - cron: '*/15 * * * *'
  workflow_dispatch: # امکان اجرای دستی از داخل تب Actions گیت‌هاب

jobs:
  start-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Auto Start Script
        env:
          PREPARE_COOKIE: ${{ secrets.PREPARE_COOKIE }}
        run: python auto_start.py
